# ─────────────────────────────────────────────────────────────────────────────
# pixel-pipeline 설정. 게임에 맞춘 값은 전부 여기에 박는다. run.py 는 건드릴 일이 없다.
# 바꿀 자리는 세 곳:  swatch / subjects / style   (+ [pixellab] 의 description)
# 아래 값은 실제로 돌려서 검증한 "사이버펑크 상점 건물" 프리셋이다. 그대로 덮어써서 쓰면 된다.
# ─────────────────────────────────────────────────────────────────────────────

# ── ① swatch: 화풍을 잡아주는 레퍼런스 이미지 ── ← 여기를 바꾸세요
# 로컬 파일 경로. 실행할 때 ApiFrame 에 업로드해서 쓴다(업로드본은 1~2시간 뒤 만료, 매 실행마다 재업로드).
swatch = "swatch.png"
# 이미 어딘가에 올려둔 공개 CDN URL 이 있으면 위 줄을 지우고 이 형태로 쓰세요.
# http 로 시작하면 업로드를 건너뛰고 그대로 전달한다.
# swatch = "https://cdn2.apiframe.ai/images/420e983e-3674-45cb-b660-7faf0617d18f-1.webp"
# swatch = ""   # 빈 문자열이면 레퍼런스 없이 텍스트 프롬프트만으로 생성

out_dir = "out"   # out/raw = gpt-image-2 원본, out/pixel = 픽셀화 결과
count = 1         # 실행당 생성 개수. --count 로 덮어쓴다.

# ── ② 테마(변주 축) ── ← 여기를 바꾸세요
# 한 줄에 하나. 위에서부터 순서대로 돌아가며 아래 style 문장과 합쳐진다.
# gpt-image-2 는 seed 가 없어서 레퍼런스의 장악력을 파라미터로 못 푼다. 변주는 여기서 만든다.
subjects = [
  "narrow two-story ramen noodle shop",
  "wide single-story auto repair garage",
  "three-story pawn shop with barred windows",
  "narrow karaoke bar with stacked signboards",
  "single-story convenience store with wide glass front",
  "two-story back-alley clinic",
  "wide laundromat with roller shutters",
  "narrow electronics parts shop, cluttered storefront",
  "two-story gun and ammo shop",
  "single-story street food stall block",
  "three-story cheap apartment over a storefront",
  "wide scrapyard office with corrugated walls",
  "narrow barber shop with a spiral pole",
  "two-story data broker office, shuttered ground floor",
  "single-story vending machine kiosk row",
]

# ── ③ 스타일 문장(모든 이미지 공통, 고정 절반) ── ← 여기를 바꾸세요
# 시점·재질·금지 요소를 여기서 못 박는다. 간판 언어처럼 안 적으면 제멋대로 갈리는 것도 여기서 고정한다.
style = """
pixel art game sprite, top-down game sprite, high-angle top-down, orthographic, \
no perspective, no vanishing point, flat rooftop seen from above and flat front facade \
visible, no pitched roof, no tiled roof, no side walls, flat 2D sprite, even flat daylight, \
grey concrete walls, colorful painted shop signage and awnings, colored doors and shutters, \
all signage text in English, latin alphabet only, no korean hangul, no japanese or chinese \
characters, solid local colors, matte, clean outline, limited palette, plain white background, \
sprite asset
"""

# ── gpt-image-2 파라미터 (ApiFrame gptImage2Params 로 그대로 전달) ──
# 쓸 수 있는 필드: quality(low|medium|high|auto), aspect_ratio(1:1|3:2|2:3),
#                  output_format(png|jpeg|webp), background(auto|opaque),
#                  moderation(auto|low), number_of_images(1~10)
[apiframe]
quality = "high"
aspect_ratio = "1:1"
output_format = "png"

# ── PixelLab 픽셀화 파라미터 (/create-image-pixflux 바디로 그대로 전달) ──
# 이 테이블에 적은 키가 그대로 요청 바디가 된다. 필드를 추가해도 run.py 는 안 고쳐도 된다.
# 추가로 쓸 수 있는 필드: direction(south 등), outline, shading, detail, isometric,
#                        text_guidance_scale, no_background, seed
[pixellab]
# 원본이 지배하므로 description 은 일반적으로 써도 된다(테마별로 바꿀 필요 없음). ← 여기를 바꾸세요
description = "city building, front view, grey concrete walls, flat concrete rooftop, ground-floor storefront, rectangular windows, colorful signage accents, flat even daylight, plain background"
view = "high top-down"          # side | low top-down | high top-down
image_size = { width = 320, height = 320 }   # 16~400 (최대 400x400)
init_image_strength = 999       # 1~999. 높을수록 원본을 그대로 '픽셀화'만 한다. 999 = 최대치
# seed = 12345                  # 고정하면 같은 입력에 같은 결과

# ── 배경 제거 ──
# PixelLab 은 200px 를 넘으면 투명 배경을 안 준다. 그래서 흰 배경을 코드로 없앤다.
# PixelLab 쪽 no_background 를 쓰는 작은 사이즈라면 remove = false 로 꺼라.
[background]
remove = true
threshold = 230   # 이 값 이상(RGB 전 채널)이면 배경 후보. 배경이 누런 편이면 낮춰라.
